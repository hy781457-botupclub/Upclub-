version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MOTHER_API_URL=https://draw.ar-lottery01.com/WinGo/WinGo_1M.json
      - PORT=4000
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
