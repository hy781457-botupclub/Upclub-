<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Panel — Current Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    .box { border: 1px solid #ddd; padding: 1rem; width: 320px; margin: auto; }
    .period { font-size: 1.25rem; margin-bottom: .5rem; }
    .number { font-size: 2rem; font-weight: bold; color: #0a74da; }
    .status { margin-top: .5rem; color: #666; }
  </style>
</head>
<body>
  <h2 style="text-align:center">Wingo (white-label) — Current Period</h2>
  <div class="box">
    <div class="period" id="period">—</div>
    <div class="number" id="number">—</div>
    <div class="status" id="status">Waiting for result...</div>
  </div>

  <script>
    const periodEl = document.getElementById('period');
    const numberEl = document.getElementById('number');
    const statusEl = document.getElementById('status');

    async function loadCurrent() {
      try {
        const r = await fetch('/api/current');
        if (!r.ok) { statusEl.textContent = 'No result yet'; return; }
        const j = await r.json();
        show(j);
      } catch (e) {
        statusEl.textContent = 'Error fetching current';
      }
    }

    function show(obj) {
      periodEl.textContent = 'Period: ' + obj.period;
      numberEl.textContent = obj.number;
      statusEl.textContent = 'Updated: ' + new Date(obj.createdAt).toLocaleTimeString();
    }

    // SSE connection
    const sse = new EventSource('/events');
    sse.addEventListener('current', e => {
      const data = JSON.parse(e.data);
      show(data);
    });
    sse.onerror = () => { statusEl.textContent = 'SSE disconnected'; };

    loadCurrent();
  </script>
</body>
</html>
