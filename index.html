<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPCLUB LIVE ADMIN</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: white; text-align: center; padding: 20px; }
        .dashboard { max-width: 400px; margin: auto; background: #151921; padding: 20px; border-radius: 20px; border: 1px solid #2b2f3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer-box { font-size: 50px; font-weight: bold; color: #ffbf00; margin: 20px 0; }
        .card { background: #1e232d; padding: 15px; border-radius: 12px; margin: 10px 0; border-left: 5px solid #4ecca3; }
        .label { font-size: 12px; color: #9aa4bf; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: bold; color: #4ecca3; }
        .hack-box { margin-top: 20px; padding: 20px; background: #1e232d; border-radius: 15px; border: 2px dashed #4ecca3; }
        #hack-num { font-size: 60px; font-weight: bold; display: block; }
        #hack-details { font-size: 18px; font-weight: bold; margin-top: 10px; }
        .status-footer { font-size: 10px; color: #00ff00; margin-top: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2 style="color: #4ecca3;">UPCLUB ADMIN</h2>
        <div id="timer" class="timer-box">00:00</div>
        
        <div class="card">
            <div class="label">Current Period</div>
            <div id="period" class="value">LOADING...</div>
        </div>

        <div class="hack-box">
            <div class="label">Live Hack Result</div>
            <span id="hack-num">?</span>
            <div id="hack-details">WAITING...</div>
        </div>

        <div class="status-footer">● SECURE API CONNECTED</div>
    </div>

    <script>
        async function update() {
            try {
                const res = await fetch("/api/data");
                const data = await res.json();
                if (data.ok) {
                    // टाइमर अपडेट
                    document.getElementById("timer").textContent = `00:${data.timer < 10 ? '0'+data.timer : data.timer}`;
                    document.getElementById("period").textContent = data.period;
                    
                    // अगर टाइमर 45 सेकंड से कम है तो हैक दिखाओ
                    if(data.timer <= 45) {
                        document.getElementById("hack-num").textContent = data.hack.num;
                        document.getElementById("hack-details").textContent = data.hack.size + " | " + data.hack.color;
                        
                        let color = data.hack.color === "GREEN" ? "#35e98b" : (data.hack.color === "RED" ? "#ff4050" : "#b34dff");
                        document.getElementById("hack-num").style.color = color;
                        document.getElementById("hack-details").style.color = color;
                    } else {
                        document.getElementById("hack-num").textContent = "?";
                        document.getElementById("hack-details").textContent = "WAITING...";
                        document.getElementById("hack-num").style.color = "#ffbf00";
                        document.getElementById("hack-details").style.color = "#8794b0";
                    }
                }
            } catch (e) { 
                console.log("Sync Error");
                document.getElementById("period").textContent = "OFFLINE";
            }
        }
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
