<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP NAVIGATOR | HARENDRA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; }
        .container { width: 90%; max-width: 400px; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); padding: 30px; border-radius: 20px; border: 2px solid #00d2ff; text-align: center; }
        .marquee { width: 100%; position: absolute; top: 0; left: 0; background: rgba(0,210,255,0.2); color: gold; padding: 10px; overflow: hidden; white-space: nowrap; }
        .marquee span { display: inline-block; padding-left: 100%; animation: scroll 15s linear infinite; font-weight: bold; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #ff9f00; margin: 20px auto; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; transition: 0.5s; }
        .btn { width: 100%; padding: 15px; background: gold; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="marquee"><span>OWNER: HARENDRA YADAV ★ HARENDRA YADAV ★ HARENDRA YADAV</span></div>
    <div class="container">
        <h2 style="color:#00d2ff;">VIP NAVIGATOR PRO</h2>
        <div id="round" style="margin:20px 0; color:cyan;">ROUND: SYNCING...</div>
        <div class="circle" id="result">--</div>
        <button class="btn" onclick="location.reload()">REFRESH SERVER</button>
    </div>

    <script>
        async function startSync() {
            try {
                // सीधे मदर JSON से डेटा उठाना (बिना index.js के झंझट के)
                const target = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=" + Date.now();
                const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(target));
                const data = await response.json();

                if (data && data.list) {
                    const last = data.list[0];
                    document.getElementById('round').innerText = "ROUND: " + (parseInt(last.issueNumber) + 1);
                    const pred = last.number >= 5 ? "SMALL" : "BIG";
                    const resBox = document.getElementById('result');
                    resBox.innerText = pred;
                    resBox.style.color = pred === 'BIG' ? 'gold' : '#0f0';
                    resBox.style.borderColor = pred === 'BIG' ? 'gold' : '#0f0';
                }
            } catch (e) {
                document.getElementById('round').innerText = "RECONNECTING...";
            }
        }
        setInterval(startSync, 3000);
        startSync();
    </script>
</body>
</html>
