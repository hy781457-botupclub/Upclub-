<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP NAVIGATOR | HARENDRA YADAV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .navigator-container { width: 100%; height: 100%; max-width: 400px; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); padding: 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #00d2ff; position: relative; }
        .name-marquee { width: 100%; background: rgba(0, 210, 255, 0.2); color: gold; font-weight: bold; padding: 8px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #00d2ff; position: absolute; top: 0; font-size: 14px; }
        .name-marquee span { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .header-logo { font-size: 24px; font-weight: bold; color: #00d2ff; margin-top: 50px; text-shadow: 0 0 10px #00d2ff; }
        .timer-circle { width: 160px; height: 160px; border-radius: 50%; border: 6px solid #ff9f00; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px #ff9f00; margin: 20px 0; }
        .round-box { width: 90%; background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .res-circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #00ff00; display: flex; justify-content: center; align-items: center; font-size: 50px; font-weight: 900; box-shadow: 0 0 20px #00ff00; }
    </style>
</head>
<body>
    <div class="navigator-container">
        <div class="name-marquee"><span>OWNER: HARENDRA YADAV ★ HARENDRA YADAV ★ HARENDRA YADAV ★</span></div>
        <div class="header-logo">VIP NAVIGATOR PRO</div>
        <div class="timer-circle"><div style="font-size:40px; color:#ff9f00;">00:--</div><div style="font-size:10px; color:#aaa;">TIME LEFT</div></div>
        <div class="round-box"><div id="round" style="letter-spacing:1px;">ID: SYNCING...</div></div>
        <div style="width:90%; border:2px solid #ff9f00; border-radius:15px; padding:20px; text-align:center;">
            <div style="color:#ff9f00; margin-bottom:10px; font-size:12px;">LIVE RESULT</div>
            <div class="res-circle" id="result">--</div>
        </div>
        <button onclick="location.reload()" style="margin-top:20px; width:90%; padding:15px; background:gold; border:none; border-radius:10px; font-weight:bold; color:#000;">REFRESH SERVER</button>
    </div>

    <script>
        async function fetchDirect() {
            try {
                const ts = Date.now();
                // सीधे JSON लिंक का उपयोग (Proxy के साथ)
                const url = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=" + ts;
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                const data = await response.json();
                
                if (data && data.list) {
                    const last = data.list[0];
                    document.getElementById('round').innerText = "ID: " + (parseInt(last.issueNumber) + 1);
                    const pred = last.number >= 5 ? "SMALL" : "BIG";
                    const resCircle = document.getElementById('result');
                    resCircle.innerText = pred;
                    resCircle.style.color = pred === 'BIG' ? '#ff9f00' : '#00ff00';
                    resCircle.style.borderColor = pred === 'BIG' ? '#ff9f00' : '#00ff00';
                }
            } catch (e) { document.getElementById('round').innerText = "RECONNECTING..."; }
        }
        setInterval(fetchDirect, 3000);
        fetchDirect();
    </script>
</body>
</html>
