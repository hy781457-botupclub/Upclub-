<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP NAVIGATOR | HARENDRA YADAV</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; }
        .container { width: 90%; max-width: 400px; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); padding: 30px; border-radius: 20px; border: 2px solid #00d2ff; text-align: center; box-shadow: 0 0 20px #00d2ff; }
        .marquee { width: 100%; position: absolute; top: 0; left: 0; background: rgba(0,210,255,0.2); color: gold; padding: 10px; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #00d2ff; }
        .marquee span { display: inline-block; padding-left: 100%; animation: scroll 15s linear infinite; font-weight: bold; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #ff9f00; margin: 20px auto; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; transition: 0.5s; }
        .round-id { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-bottom: 20px; color: cyan; font-family: monospace; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(to right, #ff9f00, #d45d00); border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="marquee"><span>OWNER: HARENDRA YADAV ★ HARENDRA YADAV ★ HARENDRA YADAV ★</span></div>
    <div class="container">
        <h2 style="color:#00d2ff; margin-bottom:20px;">VIP NAVIGATOR PRO</h2>
        <div class="round-id" id="round">ROUND: SYNCING...</div>
        <div class="circle" id="result">--</div>
        <div id="pattern" style="font-size:12px; color:#555; margin-bottom:20px;">● MOTHER API CONNECTED</div>
        <button class="btn" onclick="location.reload()">REFRESH SERVER</button>
    </div>

    <script>
        async function runHack() {
            try {
                // आपके Render सर्वर से डेटा मंगाना
                const response = await fetch("/api/live"); 
                const data = await response.json();

                if (data.next_period) {
                    // ID और प्रेडिक्शन अपडेट
                    document.getElementById('round').innerText = "NEXT: " + data.next_period;
                    document.getElementById('result').innerText = data.size;
                    document.getElementById('pattern').innerText = "● MOTHER API SYNC ACTIVE";
                    
                    // रंग बदलना (BIG के लिए गोल्ड, SMALL के लिए हरा)
                    const isBig = data.size === 'BIG';
                    const circle = document.getElementById('result');
                    circle.style.borderColor = isBig ? 'gold' : '#0f0';
                    circle.style.color = isBig ? 'gold' : '#0f0';
                    circle.style.boxShadow = isBig ? '0 0 20px gold' : '0 0 20px #0f0';
                }
            } catch (e) {
                document.getElementById('round').innerText = "RETRYING CONNECTION...";
            }
        }

        // हर 3 सेकंड में डेटा अपडेट
        setInterval(runHack, 3000);
        runHack();
    </script>
</body>
</html>
