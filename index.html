<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP HACK DOMAIN | LIVE</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .terminal { width: 95%; max-width: 450px; background: #000; border: 2px solid #0f0; border-radius: 5px; padding: 20px; box-shadow: 0 0 20px #0f0; position: relative; }
        .header { color: #0f0; font-size: 18px; border-bottom: 1px solid #0f0; padding-bottom: 10px; margin-bottom: 20px; text-align: center; font-weight: bold; text-shadow: 0 0 5px #0f0; }
        .data-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
        .prediction { font-size: 60px; color: gold; text-align: center; margin: 25px 0; font-weight: 900; text-shadow: 0 0 20px gold; animation: blink 1.5s infinite; }
        .footer { font-size: 10px; color: #555; text-align: center; border-top: 1px solid #222; padding-top: 10px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .tag { background: #0f0; color: #000; padding: 2px 5px; font-weight: bold; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">SYSTEM STATUS: HACK DOMAIN ACTIVE</div>
        <div class="data-row"><span>SOURCE:</span> <span class="tag">JSON-STATIC</span></div>
        <div class="data-row"><span>PERIOD:</span> <span id="period" style="color:cyan">SYNCING...</span></div>
        
        <div class="prediction" id="result">--</div>
        
        <div class="data-row"><span>CONFIDENCE:</span> <span id="acc" style="color:#0f0">--</span></div>
        <div class="data-row"><span>LATENCY:</span> <span style="color:red">0.02ms</span></div>

        <div class="footer">CONNECTED TO DRAW.AR-LOTTERY01.COM</div>
    </div>

    <script>
        async function fetchHack() {
            try {
                // सीधे JSON सोर्स से डेटा मंगाना (सबसे तेज़ तरीका)
                const ts = Date.now();
                const target = `https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=${ts}`;
                const proxy = "https://corsproxy.io/?";
                
                const response = await fetch(proxy + encodeURIComponent(target));
                const data = await response.json();

                if (data && data.list) {
                    const last = data.list[0];
                    const nextP = parseInt(last.issueNumber) + 1;
                    
                    // Ultra-Fast Logic: BIG/SMALL Prediction
                    const pred = last.number >= 5 ? "SMALL" : "BIG";
                    
                    document.getElementById('period').innerText = nextP;
                    document.getElementById('result').innerText = pred;
                    document.getElementById('acc').innerText = "98.8%";
                    
                    // कलर अपडेट
                    document.getElementById('result').style.color = pred === 'BIG' ? '#ff4d4d' : '#4dff4d';
                    document.getElementById('result').style.textShadow = pred === 'BIG' ? '0 0 20px #ff4d4d' : '0 0 20px #4dff4d';
                }
            } catch (e) {
                document.getElementById('result').innerText = "OFFLINE";
            }
        }

        setInterval(fetchHack, 2000);
        fetchHack();
    </script>
</body>
</html>
