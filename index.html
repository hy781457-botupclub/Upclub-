<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPCLUB 500-PERIOD HACK ADMIN</title>
<style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#050a14;color:#fff;min-height:100vh;}
    .header{background:#0d1526;border-bottom:2px solid #35e98b;padding:20px;text-align:center;}
    .logo{font-size:24px;font-weight:900;letter-spacing:2px;}
    .logo span{color:#35e98b;}
    .status-bar{background:#162136;padding:10px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:12px;}
    .dot{width:10px;height:10px;border-radius:50%;background:#777;}
    .dot.live{background:#35e98b;box-shadow:0 0 10px #35e98b;}
    .container{max-width:800px;margin:auto;padding:20px;}
    .grid{display:grid;grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px;}
    .card{background:#111a2d;border:1px solid #253350;border-radius:12px;padding:20px;text-align:center;}
    .card-label{color:#8794b0;font-size:11px;margin-bottom:8px;text-transform:uppercase;}
    .card-value{font-size:22px;font-weight:800;color:#35e98b;}
    .prediction-box{background:linear-gradient(145deg, #111a2d, #0d1526);border:2px solid #35e98b;border-radius:20px;padding:40px 20px;text-align:center;margin-top:20px;}
    .pred-num{font-size:100px;font-weight:900;margin:10px 0;text-shadow:0 0 20px rgba(53,233,139,0.3);}
    .pred-details{font-size:24px;font-weight:bold;letter-spacing:2px;padding:10px;border-radius:10px;display:inline-block;background:#050a14;}
    .color-dot{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:10px;}
    .debug-box{margin-top:20px;background:#000;padding:15px;border-radius:10px;font-family:monospace;font-size:10px;color:#35e98b;max-height:150px;overflow:auto;}
</style>
</head>
<body>

<header class="header">
  <div class="logo">UPCLUB <span>HACK</span> PRO</div>
</header>
<div class="status-bar">
  <div id="statusDot" class="dot"></div>
  <span id="statusText">SYSTEM CONNECTING...</span>
</div>

<main class="container">
  <section class="grid">
    <div class="card"><div class="card-label">Current Period</div><div id="issue">—</div></div>
    <div class="card"><div class="card-label">Last Win Number</div><div id="number">—</div></div>
  </section>

  <div class="card"><div class="card-label">Next Period Target</div><div id="nextIssue" style="font-size:28px; color:#fff;">—</div></div>

  <section class="prediction-box">
    <div class="card-label" style="color:#35e98b; font-size:14px;">500-Period Deep Analysis Result</div>
    <div id="bigNumberDisplay" class="pred-num">—</div>
    <div id="nextDetails" class="pred-details">WAITING...</div>
  </section>

  <section class="debug-box">
    <div>[SYSTEM LOG]: <span id="log">Initializing 500-period history scan...</span></div>
    <pre id="raw"></pre>
  </section>
</main>

<script>
async function loadData(){
  try{
    const response = await fetch("/api/wingo?t=" + Date.now());
    if(!response.ok) throw new Error("Connection Lost");
    
    const data = await response.json();
    
    if(data.ok){
      document.getElementById("issue").textContent = data.current.period;
      document.getElementById("number").textContent = data.current.number;
      document.getElementById("nextIssue").textContent = data.next.period;
      
      const num = data.next.predicted_number ?? "—";
      const size = data.next.predicted_size || "—";
      const color = data.next.predicted_color || "—";
      
      document.getElementById("bigNumberDisplay").textContent = num;
      
      // Color Styling
      let colorCode = "#777";
      if(color === "GREEN") colorCode = "#35e98b";
      if(color === "RED") colorCode = "#ff4050";
      if(color === "VIOLET") colorCode = "#b34dff";
      
      document.getElementById("nextDetails").innerHTML = 
        `<span style="color:<latex>{colorCode}"></latex>{size}</span> | <span style="color:<latex>{colorCode}"></latex>{color}</span>`;
      document.getElementById("bigNumberDisplay").style.color = colorCode;

      document.getElementById("statusDot").className = "dot live";
      document.getElementById("statusText").textContent = "500P ANALYSIS ACTIVE";
      document.getElementById("log").textContent = "Analysis complete for period " + data.next.period;
    }
  } catch(e) {
    document.getElementById("statusText").textContent = "OFFLINE";
    document.getElementById("statusDot").className = "dot";
    document.getElementById("log").textContent = "Error: " + e.message;
  }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
