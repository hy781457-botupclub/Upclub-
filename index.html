<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP NAVIGATOR | HARENDRA YADAV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .navigator-container { width: 100%; height: 100%; max-width: 400px; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); padding: 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid #00d2ff; position: relative; }
        .name-marquee { width: 100%; background: rgba(0, 210, 255, 0.2); color: gold; font-weight: bold; padding: 8px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #00d2ff; position: absolute; top: 0; font-size: 14px; }
        .name-marquee span { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .res-circle { width: 130px; height: 130px; border-radius: 50%; border: 6px solid #00ff00; display: flex; justify-content: center; align-items: center; font-size: 50px; font-weight: 900; box-shadow: 0 0 30px #00ff00; margin-top: 20px; }
        .status-tag { font-size: 10px; color: #0f0; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="navigator-container">
        <div class="name-marquee"><span>OWNER: HARENDRA YADAV ★ HARENDRA YADAV ★ HARENDRA YADAV ★</span></div>
        <div style="margin-top: 50px; color: #00d2ff; font-weight: bold; letter-spacing: 2px;">MOTHER API CONNECTED</div>
        <div style="width: 170px; height: 170px; border-radius: 50%; border: 6px solid #ff9f00; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 25px #ff9f00; margin: 20px 0;">
            <div id="timer" style="font-size: 45px; color: #ff9f00; font-weight: 900;">LIVE</div>
        </div>
        <div id="round" style="background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; padding: 12px; border-radius: 10px; width: 90%; text-align: center; margin-bottom: 20px;">ID: SYNCING...</div>
        <div style="width: 90%; border: 2px solid #ff9f00; border-radius: 15px; padding: 20px; text-align: center; background: rgba(0,0,0,0.6);">
            <div style="color:#ff9f00; margin-bottom:10px; font-size:12px;">ULTRA PREDICTION</div>
            <div class="res-circle" id="result">--</div>
            <div class="status-tag" id="accuracy">ACCURACY: 99.1%</div>
        </div>
        <button onclick="location.reload()" style="margin-top: 25px; width: 90%; padding: 15px; background: linear-gradient(to right, #ff9f00, #d45d00); border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 18px;">REFRESH HACK</button>
    </div>

    <script>
        const MOTHER_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
        
        async function fetchMotherData() {
            try {
                // सीधे मदर सोर्स से डेटा मंगाना (बिना किसी सर्वर के)
                const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(MOTHER_URL + "?t=" + Date.now()));
                const data = await response.json();
                
                if (data && data.list) {
                    const last = data.list[0];
                    document.getElementById('round').innerText = "ROUND ID: " + (parseInt(last.issueNumber) + 1);
                    
                    // Mother API Trend Logic
                    const pred = last.number >= 5 ? "SMALL" : "BIG";
                    const resCircle = document.getElementById('result');
                    resCircle.innerText = pred;
                    
                    const isBig = pred === 'BIG';
                    resCircle.style.color = isBig ? '#ff9f00' : '#00ff00';
                    resCircle.style.borderColor = isBig ? '#ff9f00' : '#00ff00';
                    resCircle.style.boxShadow = isBig ? '0 0 30px #ff9f00' : '0 0 30px #00ff00';
                }
            } catch (e) {
                document.getElementById('round').innerText = "CONNECTING TO MOTHER API...";
            }
        }

        setInterval(fetchMotherData, 3000);
        fetchMotherData();
    </script>
</body>
</html>
