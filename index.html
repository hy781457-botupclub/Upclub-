<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDG VIP PREDICTOR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .app-container {
            width: 90%; max-width: 400px; background: #1a1a1a;
            border: 2px solid gold; border-radius: 20px;
            padding: 25px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .header { color: gold; font-size: 22px; font-weight: bold; letter-spacing: 2px; }
        .status-bar { font-size: 12px; margin-top: 10px; color: #00ff00; }
        .divider { height: 1px; background: #333; margin: 20px 0; }
        .period-box { font-size: 14px; color: #aaa; }
        .result-box { 
            font-size: 60px; font-weight: 900; margin: 20px 0;
            text-shadow: 0 0 20px #00ff00; color: #00ff00;
        }
        .accuracy { color: cyan; font-size: 16px; font-weight: bold; }
        .refresh-btn {
            margin-top: 25px; width: 100%; padding: 12px;
            background: gold; color: #000; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        .footer { font-size: 10px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">BDG VIP SERVER</div>
        <div class="status-bar" id="status">CONNECTING...</div>
        
        <div class="divider"></div>

        <div class="period-box" id="period-display">Next Period: Syncing..</div>
        <div class="result-box" id="result-display">--</div>
        <div class="accuracy" id="acc-display">Confidence: --</div>

        <button class="refresh-btn" onclick="location.reload()">REFRESH SERVER</button>
        
        <div class="footer">POWERED BY RENDER CLOUD SYSTEM</div>
    </div>

    <script>
        async function fetchPrediction() {
            try {
                // यह आपके Render के index.js वाले API मार्ग से डेटा लाएगा
                const response = await fetch('/api/predict');
                const data = await response.json();

                if (data.period) {
                    document.getElementById('status').innerText = "● LIVE SYNC ACTIVE";
                    document.getElementById('status').style.color = "#00ff00";
                    document.getElementById('period-display').innerText = "Next Period: " + data.period;
                    document.getElementById('result-display').innerText = data.prediction;
                    
                    // Accuracy Logic
                    document.getElementById('acc-display').innerText = "Confidence: 94% (DRAGON)";
                    
                    // Color change based on result
                    document.getElementById('result-display').style.color = 
                        data.prediction === 'BIG' ? '#ff4d4d' : '#4dff4d';
                    document.getElementById('result-display').style.textShadow = 
                        data.prediction === 'BIG' ? '0 0 20px #ff4d4d' : '0 0 20px #4dff4d';
                }
            } catch (err) {
                document.getElementById('status').innerText = "● SERVER ERROR: CHECK TOKEN";
                document.getElementById('status').style.color = "#ff0000";
                document.getElementById('result-display').innerText = "!!";
            }
        }

        // हर 3 सेकंड में अपडेट
        setInterval(fetchPrediction, 3000);
        fetchPrediction();
    </script>
</body>
</html>
