<script>
    async function updateLive() {
        try {
            const res = await fetch("/api/live-hack");
            const data = await res.json();
            if (data.ok) {
                // Update Period and Timer
                document.getElementById("timer").textContent = `00:${data.timer < 10 ? '0'+data.timer : data.timer}`;
                document.getElementById("nextIssue").textContent = data.period;
                
                // Hamesha live result dikhaye
                document.getElementById("bigNumberDisplay").textContent = data.hack.num;
                document.getElementById("nextDetails").textContent = `<latex>{data.hack.size} | </latex>{data.hack.color}`;
                
                let color = data.hack.color === "GREEN" ? "#35e98b" : "#ff4050";
                document.getElementById("bigNumberDisplay").style.color = color;
            }
        } catch (e) { console.log("Live Sync Error"); }
    }
    setInterval(updateLive, 1000);
</script>
