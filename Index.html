<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Deep Analysis Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #111827; color: white; padding: 20px; text-align: center; }
    .card { background: #1f2937; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .status { font-size: 12px; padding: 5px; color: #10b981; }
    .data-box { text-align: left; background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 10px; font-family: monospace; }
    .highlight { color: #f59e0b; font-weight: bold; }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Wingo Predictor</h2>
    <div id="status" class="status">Connecting...</div>
    <div id="output" class="data-box">Loading data...</div>
    <button onclick="loadData()">Manual Refresh</button>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/wingo');
        const data = await res.json();
        if(data.ok) {
          document.getElementById('status').innerText = "Last Sync: " + new Date().toLocaleTimeString();
          document.getElementById('output').innerHTML = `
            <p><b>Current Period:</b> <latex>{data.current.period}</p>
            <p><b>Last Result:</b> </latex>{data.current.number}</p>
            <hr>
            <p class="highlight">Next Period: ${data.next.period}</p>
            <p class="highlight">Prediction: <latex>{data.next.predicted_size} (</latex>{data.next.predicted_number})</p>
            <hr>
            <p style="font-size: 11px;">Stats: B <latex>{data.analysis.big_percent} | S </latex>{data.analysis.small_percent}</p>
          `;
        }
      } catch(e) {
        document.getElementById('status').innerText = "Connection Failed!";
      }
    }
    setInterval(loadData, 5000); // Har 5 second mein update
    loadData();
  </script>
</body>
</html>
